services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: janus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d janus"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - janus_postgres:/var/lib/postgresql/data

volumes:
  janus_postgres:

